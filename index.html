    <style>
      html, body { background: #050507; margin: 0; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 38%, #1d1430 0%, #07070b 55%, #000 100%); transition: opacity .6s ease, visibility .6s; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .b-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot svg { width: 92px; height: 92px; animation: bootPulse 1.6s ease-in-out infinite; }
      #boot .b-word { font: 700 26px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: .42em; padding-left: .42em; background: linear-gradient(90deg, #fff, #a9abba); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot .b-bars { display: flex; gap: 4px; height: 18px; align-items: flex-end; }
      #boot .b-bars i { width: 3px; border-radius: 2px; background: linear-gradient(#c4b5fd, #7c3aed); animation: bootBar 1s ease-in-out infinite; }
      #boot .b-bars i:nth-child(2) { animation-delay: -.2s } #boot .b-bars i:nth-child(3) { animation-delay: -.45s } #boot .b-bars i:nth-child(4) { animation-delay: -.7s } #boot .b-bars i:nth-child(5) { animation-delay: -.3s }
      @keyframes bootPulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(139,92,246,0)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(139,92,246,.55)); } }
      @keyframes bootBar { 0%,100% { height: 4px } 50% { height: 18px } }
      @media (prefers-reduced-motion: reduce) { #boot svg, #boot .b-bars i { animation: none; height: 10px } }
    </style>
